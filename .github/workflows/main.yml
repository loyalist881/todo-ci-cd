name: CI/CD Pipeline

on:
  push: 
    branches: 
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      jar-path: ${{ steps.set-jar-path.outputs.jar-path }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3  
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Maven
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Run tests
        run: mvn test

      - name: Save JAR path
        id: set-jar-path
        run: echo "jar-path=target/TODO-0.0.1-SNAPSHOT.jar" >> $GITHUB_OUTPUT

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: TODO-jar
          path: target/TODO-0.0.1-SNAPSHOT.jar

  build-and-push-docker: 
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: TODO-jar
          path: target

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/TODO:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/TODO:latest

  deploy:
    needs: build-and-push-docker 
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on VM via host machine
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 50000
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/TODO:latest
            docker stop todo-app || true
            docker rm todo-app || true
            docker run -d --name calculator -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/TODO:latest
